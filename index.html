<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* { 
    box-sizing: border-box; 
    caret-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Kanit', sans-serif;
    background: #0c0c10;
    color: #e2e8f0;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
}

body::after {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
        radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.2) 0%, transparent 35%),
        radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.18) 0%, transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(236, 72, 153, 0.12) 0%, transparent 30%),
        radial-gradient(circle at 15% 75%, rgba(34, 211, 238, 0.15) 0%, transparent 30%);
    animation: bgFloat 15s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes bgFloat {
    0% { 
        transform: translate(0, 0) scale(1);
    }
    33% { 
        transform: translate(5%, 3%) scale(1.05);
    }
    66% { 
        transform: translate(-3%, 5%) scale(0.98);
    }
    100% { 
        transform: translate(0, 0) scale(1);
    }
}

.card-grid {
    display: grid;
    gap: 20px;
    padding: 40px;
    padding-bottom: 120px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    position: relative;
    z-index: 1;
}

.device-card {
    background: rgba(20, 20, 28, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 28px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    transition: all 0.3s ease;
    animation: fadeSlideIn 0.5s ease-out forwards;
    opacity: 0;
    transform: translateY(20px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

@keyframes fadeSlideIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.device-card:hover {
    transform: translateY(-6px);
    border-color: rgba(56, 189, 248, 0.3);
    box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(56, 189, 248, 0.08),
        inset 0 0 30px rgba(56, 189, 248, 0.02);
}

.device-card.offline {
    background: rgba(18, 18, 22, 0.9);
    border-color: rgba(255, 255, 255, 0.03);
}

.device-card.offline .input-value,
.device-card.offline .jig-name {
    opacity: 0.35;
}

.device-card.online {
    order: -1;
}

.jig-name {
    font-weight: 600;
    color: #38bdf8;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    white-space: nowrap;
}

.input-row {
    margin-bottom: 8px;
}

.input-value {
    font-size: 42px;
    font-weight: 700;
    color: #f0f9ff;
    letter-spacing: -1px;
    transition: all 0.3s ease;
}

.total-row {
    font-size: 16px;
    color: #71717a;
}

.total-row span {
    color: #a1a1aa;
    font-weight: 500;
}

.pm-row {
    font-size: 13px;
    line-height: 1.5;
    color: #fb923c;
    margin-top: 12px;
    min-height: 20px;
}

.last-update {
    font-size: 12px;
    color: #52525b;
    margin-top: 8px;
}

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, 0.25);
    border-radius: 3px;
}

.navbar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px 32px;
    background: rgba(20, 20, 28, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
    border-radius: 50px;
    gap: 40px;
}

.navbar-stats {
    display: flex;
    gap: 40px;
}

.navbar-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.navbar-stat-label {
    font-size: 10px;
    color: #71717a;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.navbar-stat-value {
    font-size: 24px;
    font-weight: 700;
    color: #38bdf8;
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
}

.navbar-stat-value.online {
    color: #4ade80;
    text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
}

.navbar-stat-value.offline {
    color: #f87171;
    text-shadow: 0 0 15px rgba(248, 113, 113, 0.4);
}

@media (max-width: 640px) {
    .card-grid {
        padding: 20px;
        padding-bottom: 120px;
        gap: 16px;
    }
    .device-card {
        padding: 20px;
        min-height: 180px;
    }
    .input-value {
        font-size: 32px;
    }
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-stats">
        <div class="navbar-stat">
            <span class="navbar-stat-value" id="totalCount">0</span>
            <span class="navbar-stat-label">Total</span>
        </div>
        <div class="navbar-stat">
            <span class="navbar-stat-value online" id="onlineCount">0</span>
            <span class="navbar-stat-label">Online</span>
        </div>
        <div class="navbar-stat">
            <span class="navbar-stat-value offline" id="offlineCount">0</span>
            <span class="navbar-stat-label">Offline</span>
        </div>
    </div>
</nav>

<div class="card-grid" id="cardContainer"></div>

<script>
const apiUrl = "https://opensheet.elk.sh/1FhLvkCQ2o6ZdRAkx6vjysY9LwC3nQ3EETil7YlKqYlA/DeviceStatus";
const pmTopicUrl = "https://opensheet.elk.sh/1FhLvkCQ2o6ZdRAkx6vjysY9LwC3nQ3EETil7YlKqYlA/PMTopic";

let cardMap = new Map();
let PM_RULES = [];

function autoScaleText(element, maxSize = 28, minSize = 14) {
    let fontSize = maxSize;
    element.style.fontSize = fontSize + "px";

    while (element.scrollWidth > element.offsetWidth && fontSize > minSize) {
        fontSize--;
        element.style.fontSize = fontSize + "px";
    }
}

const resizeObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
        const nameEl = entry.target.querySelector(".jig-name");
        if (nameEl) {
            autoScaleText(nameEl, 28, 14);
        }
    }
});

function isOffline(timestamp) {
    const now = new Date();
    const last = new Date(timestamp);
    const diffMinutes = (now - last) / 1000 / 60;
    return diffMinutes > 20;
}

async function loadPMTopics() {
    try {
        const res = await fetch(pmTopicUrl, { cache: "no-store" });
        const data = await res.json();
        PM_RULES = data.map(row => ({
            name: row.Items,
            interval: Number(String(row.Cycles).replace(/,/g, ""))
        }));
    } catch (err) {
        console.error("PM Topic load error:", err);
    }
}

function isPMZone(count1) {
    return (count1 >= 0 && count1 <= 10) ||
           (count1 >= 19501 && count1 <= 20000);
}

function getPMList(total) {
    const THRESHOLD = 1000;
    let list = [];
    PM_RULES.forEach(rule => {
        let cycle = Math.floor(total / rule.interval);
        let nextTarget = Math.ceil(total / rule.interval) * rule.interval;
        let remaining = nextTarget - total;
        if (cycle > 0 || remaining <= THRESHOLD) {
            list.push(rule.name);
        }
    });
    return list;
}

async function loadData() {
    const container = document.getElementById("cardContainer");

    try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        const totalCount = data.length;
        const onlineCount = data.filter(item => !isOffline(item.Timestamp)).length;
        const offlineCount = totalCount - onlineCount;
        
        document.getElementById("totalCount").textContent = totalCount;
        document.getElementById("onlineCount").textContent = onlineCount;
        document.getElementById("offlineCount").textContent = offlineCount;

        data.forEach(item => {
            const id = item.device_id;
            const input = item.count1;
            const total = item.count2;
            const timestamp = item.Timestamp;

            let card = cardMap.get(id);

            if (!card) {
                card = document.createElement("div");
                card.className = "device-card";
                card.innerHTML = `
                    <div class="jig-name"></div>
                    <div>
                        <div class="input-row">
                            <span class="input-value"></span>
                        </div>
                        <div class="total-row"></div>
                        <div class="pm-row"></div>
                        <div class="last-update"></div>
                    </div>
                `;

                container.appendChild(card);
                cardMap.set(id, card);
                resizeObserver.observe(card);
            }

            const nameEl = card.querySelector(".jig-name");
            nameEl.textContent = id;

            card.querySelector(".input-value").textContent = input;
            card.querySelector(".total-row").textContent = "Total: " + total;
            card.querySelector(".last-update").textContent = "Last update: " + timestamp;

            const pmRow = card.querySelector(".pm-row");
            if (isPMZone(input) && PM_RULES.length > 0) {
                const list = getPMList(total);
                pmRow.innerHTML = list.length > 0
                    ? "🔧 ต้องเช็ค:<br>" + list.join("<br>")
                    : "ยังไม่ถึงรอบ PM";
            } else {
                pmRow.textContent = "";
            }

            if (isOffline(timestamp)) {
                card.classList.add("offline");
                card.classList.remove("online");
            } else {
                card.classList.remove("offline");
                card.classList.add("online");
            }
        });

    } catch (error) {
        console.error(error);
        container.innerHTML = "Error loading data";
    }
}

loadData();

async function init() {
    await loadPMTopics();
    await loadData();
    setInterval(loadData, 30000);
    setInterval(loadPMTopics, 60000);
}

init();
</script>

</body>
</html>
